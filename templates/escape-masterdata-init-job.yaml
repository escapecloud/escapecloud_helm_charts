{{- if .Values.escapeWeb.masterdataInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-masterdata-init" (include "escapecloud.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "escapecloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: escape-masterdata-init
spec:
  backoffLimit: {{ .Values.escapeWeb.masterdataInit.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.escapeWeb.masterdataInit.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "escapecloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: escape-masterdata-init
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: escape-masterdata-init
          image: "{{ .Values.escapeWeb.image.repository }}:{{ .Values.escapeWeb.image.tag }}"
          imagePullPolicy: {{ .Values.escapeWeb.image.pullPolicy }}
          {{- with .Values.global.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          workingDir: /usr/src/app
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$WEB_DB_HOST" -p "$WEB_DB_PORT" -U "$WEB_DB_USERNAME"; do
                sleep 3
              done

              until python -c "import urllib.request; urllib.request.urlopen('$ASSESSMENT_ENGINE_API_URL/readyz')"; do
                sleep 5
              done

              until python -c "import urllib.request; urllib.request.urlopen('$ASSESSMENT_ENGINE_API_URL/data/readyz')"; do
                sleep 5
              done

              python manage.py init_baseline &&
              python manage.py init_masterdata
          envFrom:
            - configMapRef:
                name: {{ include "escapecloud.webConfigMapName" . }}
            - secretRef:
                name: {{ include "escapecloud.webSecretName" . }}
          {{- with .Values.escapeWeb.masterdataInit.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
