apiVersion: v1
kind: Secret
metadata:
  name: {{ include "escapecloud.engineSecretName" . }}
  labels:
    {{- include "escapecloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: escape-engine
type: Opaque
stringData:
  {{- range $key, $value := .Values.escapeEngine.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
